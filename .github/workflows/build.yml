name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y swtpm dbus-daemon gjs init-system-helpers
      - name: Package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="0.0.0~dev.${GITHUB_RUN_NUMBER}"
          if [ "$REF_TYPE" = tag ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must use vMAJOR.MINOR.PATCH' >&2
              exit 1
            fi
            version="${REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: make test check test-integration
      - name: Build and check deb
        run: make test-deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f "cv2-fido_${TAG#v}_amd64.deb"
          test -f "cv2-fido_${TAG#v}_arm64.deb"
          sha256sum ./*.deb > SHA256SUMS
          if gh release view "$TAG" --json isDraft > release.json; then
            jq -e '.isDraft == true' release.json
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes
          fi
          gh release upload "$TAG" ./*.deb SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false
